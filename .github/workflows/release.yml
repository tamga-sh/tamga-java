name: Release

# Release automation for tamga-java, in two parts:
#
# 1. `release-please` (release-type: simple) watches conventional-commit messages on `main` and
#    maintains a standing "Release PR" that accumulates CHANGELOG.md entries. It manages the
#    changelog and git tag ONLY -- it does not bump a version file anywhere in this repo, because
#    `com.palantir.git-version` (wired in build.gradle.kts) derives the actual build version from
#    the git tag at build time. `git tag v0.2.0` + a build IS the entire "bump the version"
#    operation -- there is no hand-maintained version property to keep in sync. Merging the
#    Release PR cuts the tag and publishes a GitHub Release.
#
# 2. The `publish` job runs `./gradlew publishToMavenCentral`, using the
#    vanniktech/gradle-maven-publish-plugin (see build.gradle.kts's `mavenPublishing {}` block)
#    targeting the CENTRAL PUBLISHER PORTAL (central.sonatype.com) -- explicitly NOT the legacy
#    OSSRH staging-repo flow, which Sonatype is sunsetting. Signing uses in-memory GPG keys (no
#    on-disk keyring ever touches the CI runner) and Portal TOKEN credentials (not a Sonatype JIRA
#    username/password, which belongs to the legacy OSSRH flow this pipeline deliberately does not
#    use).
#
# GOTCHA (found + fixed empirically, not a hypothetical): an earlier version of this file gated
# `publish` on a separate `release: types: [published]` trigger, on the assumption that
# release-please-action's tag/release creation would fire that event and start a new workflow run.
# It never does: release-please-action authenticated with the default `GITHUB_TOKEN` (at the time,
# no `token:` input was configured here), and GitHub explicitly does not start new workflow runs
# for events generated by the default token, to prevent recursive-run loops -- confirmed against
# release-please-action's own README ("GitHub Credentials" section), not assumed. The tag and
# GitHub Release were being created successfully, but `publish` silently never ran, which would
# have shipped a tagged-but-never-actually-published-to-Maven-Central "release" indefinitely.
#
# Fixed by chaining `publish` off `release-please`'s own job outputs in the SAME `push`-triggered
# workflow run instead of relying on a second, never-fired trigger -- the officially recommended
# pattern for exactly this case. `publish` also explicitly checks out `tag_name` (not just
# whatever ref the push happened to land on) so com.palantir.git-version resolves the exact tag the
# release was cut from.
#
# SAME ROOT CAUSE, SECOND SYMPTOM: the standing Release PR is itself opened by release-please, and
# a PR opened under the default `GITHUB_TOKEN` likewise never starts a workflow run. CI therefore
# never reported on the Release PR, branch protection's required status checks never appeared, and
# the PR sat permanently blocked -- every release so far needed an admin override to merge. Fixed
# by minting a short-lived GitHub App installation token (see the `app-token` step below) and
# handing it to release-please via its `token:` input. PRs authored by a GitHub App are NOT subject
# to the recursive-run guard, so CI runs on the Release PR and it merges on its own checks.
#
# The App token is deliberately scoped to that one step. `publish` below keeps its own workflow
# identity and its own Central Publisher Portal / GPG credentials -- nothing about its auth
# changed, and the App token is never exposed to it.
#
# `workflow_dispatch` is a manual escape hatch for `publish` alone (e.g. retrying after a
# transient Central Publisher Portal outage, or -- as happened for v1.0.0 -- re-publishing a tag
# that was already cut before this trigger fix landed) without needing to cut a whole new version
# just to get a working publish trigger.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re-)publish to Maven Central, e.g. v1.0.0. Use this to retry a
          failed or never-triggered publish without cutting a new release.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest mode, not `release-type:` -- the two are mutually exclusive
          # inputs, and passing both makes release-please ignore the config file
          # (so `extra-files` silently stops applying).
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish to Maven Central
    needs: release-please
    # always() so this can still run on a workflow_dispatch invocation, where release-please above
    # is skipped entirely (a skipped job's outputs read back as empty strings, not errors, so the
    # first half of this OR just evaluates false in that case rather than failing).
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          # Pin explicitly to the tag being published -- release-please's own tag_name output for
          # the push-triggered path, or the manually-supplied input for a workflow_dispatch retry.
          # Full history + tags so com.palantir.git-version resolves the exact tag instead of an
          # "unspecified" fallback.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        timeout-minutes: 10
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 10

      - name: Publish to the Central Publisher Portal
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
        env:
          # In-memory GPG signing -- signing plugin in build.gradle.kts reads these two project
          # properties directly by name; no on-disk keyring is generated or checked out in CI.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_IN_MEMORY_KEY_PASSWORD }}
          # Central Publisher Portal TOKEN pair (central.sonatype.com) -- NOT legacy OSSRH
          # username/password. The ORG_GRADLE_PROJECT_ prefix is Gradle's standard env-var ->
          # project-property auto-mapping convention; the vanniktech plugin reads
          # `mavenCentralUsername`/`mavenCentralPassword` project properties.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
