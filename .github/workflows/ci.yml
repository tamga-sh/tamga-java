name: CI

# Static analysis runs as its own step BEFORE `./gradlew check` so a Checkstyle/SpotBugs failure
# short-circuits the more expensive build/test/coverage steps -- see
# docs/plans/tamga-java.plan.md §5. Both tasks are also wired as `check` dependencies in
# build.gradle.kts, so re-running them inside `./gradlew check` is a cheap up-to-date no-op, not
# duplicated work.
#
# The 3-OS matrix leg is NOT "run the same Java tests three times" -- the native JNI build
# (jni/CMakeLists.txt) differs meaningfully per OS (different C toolchain, different shared-library
# extension: .so/.dylib/.dll), so this exercises three distinct native-build code paths once
# Section B lands. Today, with no native build wired yet, all three legs run the identical
# pure-Java path -- that's expected and will diverge once the JNI CMake build is real.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Temurin ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]
    steps:
      # fetch-depth: 0 (full history) so the doc-only detection below has
      # every commit it needs for an unambiguous diff against the PR's
      # actual base commit -- the default shallow (depth 1) checkout
      # doesn't guarantee that, and left dorny/paths-filter (the first
      # version of this detection step) computing an inconsistent result
      # in practice (confirmed: it reported changes outside **/*.md on a
      # PR whose actual `git diff <base>...<head>` touched only CLAUDE.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs (README/CLAUDE.md/CHANGELOG/etc.) have nothing for
      # Checkstyle/SpotBugs/the JaCoCo coverage gate to meaningfully check --
      # running them anyway means EVERY PR touching only prose fails the
      # coverage gate at the current 0%-implemented scaffold stage (this
      # repo's own CLAUDE.md is explicit that the 80% minimum must NOT be
      # loosened to work around that -- it's a real gate for real code, not
      # a value to weaken). This detects that case and skips the
      # code-verification steps below for it specifically, while still
      # letting the job itself report success so branch protection's
      # required status checks aren't left permanently pending. Does NOT
      # apply to `push` (post-merge) runs, which always run everything
      # regardless of what changed.
      #
      # Hand-rolled rather than a marketplace action: explicit and
      # verifiable against the exact same `git diff <base>...<head>`
      # invocation used to sanity-check this locally, no third-party
      # base-ref-resolution heuristics to second-guess.
      - name: Detect doc-only changes
        if: github.event_name == 'pull_request'
        id: filter
        shell: bash
        run: |
          set -eu
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "Changed files (${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}):"
          echo "$changed"
          non_docs=$(echo "$changed" | grep -v -E '\.md$' || true)
          if [ -z "$non_docs" ]; then
            echo "This PR touches only .md files -- skipping code verification."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "This PR touches non-doc files -- running full verification."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK ${{ matrix.java }} (Temurin)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Checkstyle (Google Java Style)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: SpotBugs
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: ./gradlew spotbugsMain spotbugsTest --no-daemon

      - name: Build, test, and verify coverage (80% minimum)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: ./gradlew check --no-daemon

      # Uploaded once per run, not once per matrix leg -- otherwise Codecov sees 6 reports for the
      # same commit and PR annotations get noisy. ubuntu-latest / Java 17 is the canonical leg
      # since it's the lower bound of the supported JDK matrix.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17 && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true')
        uses: codecov/codecov-action@v4
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
